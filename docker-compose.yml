services:
  app:
    build: .
    container_name: trading-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - trading_agent_data:/data
    expose:
      - "8080"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  trading_agent_data:
  caddy_data:
  caddy_config:

networks:
  web:
